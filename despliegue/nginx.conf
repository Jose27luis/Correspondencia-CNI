server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name correspondencia.tendero.pe;

    ssl_certificate /etc/letsencrypt/live/correspondencia.tendero.pe/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/correspondencia.tendero.pe/privkey.pem;

    client_max_body_size 30m;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location /archivos/ {
        alias /var/www/Correspondencia-CNI/almacen/adjuntos/;
        add_header Content-Disposition "inline";
        expires 30d;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /salud {
        proxy_pass http://127.0.0.1:8080/salud;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:3021;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
